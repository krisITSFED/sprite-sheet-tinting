<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprite tinting / browser test</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <svg class="filter-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs id="tint-defs">
            <filter id="tint-indigo" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix"
                    values="0 0 0 0 0.1568627451 0 0 0 0 0.1647058824 0 0 0 0 0.4509803922 0 0 0 1 0" />
            </filter>
            <filter id="icon-brand-default" color-interpolation-filters="sRGB">
                <feFlood class="icon-default-fill" result="brand-color" />
                <feComposite in="brand-color" in2="SourceAlpha" operator="in" />
            </filter>
            <filter id="icon-brand-hover" color-interpolation-filters="sRGB">
                <feFlood class="icon-hover-fill" result="brand-color" />
                <feComposite in="brand-color" in2="SourceAlpha" operator="in" />
            </filter>
        </defs>
    </svg>
    <header>
        <h1>Sprite tinting / browser test</h1>
        <label><input id="force-hover" type="checkbox"> Hold hover state</label>
    </header>
    <main>
        <section aria-labelledby="comparison-heading">
            <h2 id="comparison-heading">Deep indigo / #282A73</h2>
            <div class="comparison">
                <article class="sample" id="black-control">
                    <h3>Black control</h3>
                    <div class="icons"></div>
                </article>
                <article class="sample original" id="original">
                    <h3>Original CSS chain</h3>
                    <div class="icons"></div>
                </article>
                <article class="sample matrix" id="inline-matrix">
                    <h3>Inline SVG matrix</h3>
                    <div class="icons"></div>
                </article>
                <article class="sample flood" id="inline-flood">
                    <h3>Inline SVG flood / CSS branding</h3>
                    <div class="icons"></div>
                    <div class="brand-controls">
                        <label>Default <input id="brand-default" type="color" value="#006644"></label>
                        <label>Hover <input id="brand-hover" type="color" value="#282a73"></label>
                    </div>
                    <div class="reference"><span class="swatch" aria-hidden="true"></span><span id="brand-reference">#006644</span></div>
                </article>
            </div>
            <div class="reference" style="--target: #282a73"><span class="swatch"
                    aria-hidden="true"></span><span>#282A73 reference</span></div>
        </section>
        <section aria-labelledby="palette-heading">
            <h2 id="palette-heading">Inline matrix / color checks</h2>
            <div class="palette" id="palette"></div>
        </section>
    </main>
    <footer>
        <p class="status">50 x 50 px / solid.svg / sRGB / alpha preserved</p>
        <p class="status" id="sprite-status" role="status">Sprite: loading</p>
        <p class="status" id="browser"></p>
    </footer>
    <template id="icon-pair">
        <a href="#" class="editableHTML">
            <div class="sprite-icon icon-faq" aria-hidden="true"></div><span class="lnk-nav-txt">FAQ</span>
        </a>
        <ul role="tablist" aria-label="Assessment sample">
            <li class="tab side-tab" role="tab" tabindex="0" aria-selected="true">
                <div class="sprite-icon icon-assessment2" aria-hidden="true"></div>
                <div class="db-icon-txt">Assessment</div>
            </li>
        </ul>
    </template>
    <script>
        const namespace = 'http://www.w3.org/2000/svg';
        const colors = [
            ['Dark navy', '#001F3F'],
            ['Deep blue', '#003366'],
            ['Slate blue', '#483D8B'],
            ['Blue-gray', '#364F6B'],
            ['Muted navy', '#2C3E50'],
            ['Deep indigo', '#282A73']
        ];
        const template = document.querySelector('#icon-pair');
        const definitions = document.querySelector('#tint-defs');
        const palette = document.querySelector('#palette');

        document.querySelectorAll('.comparison .icons').forEach(container => {
            container.append(template.content.cloneNode(true));
        });

        colors.forEach(([name, hex], index) => {
            const channels = [1, 3, 5].map(offset => parseInt(hex.slice(offset, offset + 2), 16) / 255);
            const filter = document.createElementNS(namespace, 'filter');
            filter.id = `tint-palette-${index}`;
            filter.setAttribute('color-interpolation-filters', 'sRGB');
            const matrix = document.createElementNS(namespace, 'feColorMatrix');
            matrix.setAttribute('type', 'matrix');
            matrix.setAttribute('values', `0 0 0 0 ${channels[0]} 0 0 0 0 ${channels[1]} 0 0 0 0 ${channels[2]} 0 0 0 1 0`);
            filter.append(matrix);
            definitions.append(filter);

            const article = document.createElement('article');
            article.className = 'matrix';
            article.style.setProperty('--icon-hover', `url(#${filter.id})`);
            article.style.setProperty('--target', hex);
            const heading = document.createElement('h3');
            heading.textContent = name;
            const icons = document.createElement('div');
            icons.className = 'icons';
            icons.append(template.content.cloneNode(true));
            const reference = document.createElement('div');
            reference.className = 'reference';
            const swatch = document.createElement('span');
            swatch.className = 'swatch';
            swatch.setAttribute('aria-hidden', 'true');
            const label = document.createElement('span');
            label.textContent = hex;
            reference.append(swatch, label);
            article.append(heading, icons, reference);
            palette.append(article);
        });

        document.querySelector('#force-hover').addEventListener('change', event => {
            document.body.classList.toggle('force-hover', event.target.checked);
            updateBrandReference();
        });
        function updateBrandReference() {
            const state = document.body.classList.contains('force-hover') ? 'hover' : 'default';
            document.querySelector('#brand-reference').textContent = document.querySelector(`#brand-${state}`).value.toUpperCase();
        }
        ['default', 'hover'].forEach(state => {
            document.querySelector(`#brand-${state}`).addEventListener('input', event => {
                document.documentElement.style.setProperty(`--icon-${state}-hex`, event.target.value);
                updateBrandReference();
            });
        });
        document.querySelectorAll('a[href="#"]').forEach(link => {
            link.addEventListener('click', event => event.preventDefault());
        });
        document.querySelector('#browser').textContent = navigator.userAgent;
        const sprite = new Image();
        sprite.onload = () => { document.querySelector('#sprite-status').textContent = 'Sprite: loaded'; };
        sprite.onerror = () => { document.querySelector('#sprite-status').textContent = 'Sprite: FAILED to load solid.svg'; };
        sprite.src = 'solid.svg';
    </script>
</body>

</html>
