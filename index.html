<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprite tinting / browser test</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- BEGIN SHARED TEMPLATE ADDITION: universal icon tint filters.
         Include once near the start of body in each document using these filters (including iframes).
         Keep this SVG inline in the DOM; colors come from client branding CSS.
         Requires the shared .filter-defs, .icon-default-fill, and .icon-hover-fill CSS rules.
         Pending iOS 26 flood-hover verification and broader browser testing before production rollout. -->
    <svg class="filter-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs id="tint-defs">
            <filter id="icon-brand-default" color-interpolation-filters="sRGB">
                <feFlood class="icon-default-fill" result="brand-color" />
                <feComposite in="brand-color" in2="SourceAlpha" operator="in" />
            </filter>
            <filter id="icon-brand-hover" color-interpolation-filters="sRGB">
                <feFlood class="icon-hover-fill" result="brand-color" />
                <feComposite in="brand-color" in2="SourceAlpha" operator="in" />
            </filter>
        </defs>
    </svg>
    <!-- END SHARED TEMPLATE ADDITION. The remaining page is the R&D test harness. -->
    <header>
        <h1>Sprite tinting / browser test</h1>
        <label><input id="force-hover" type="checkbox"> Hold hover state</label>
    </header>
    <main>
        <section aria-labelledby="comparison-heading">
            <h2 id="comparison-heading">Deep indigo / #282A73</h2>
            <div class="comparison">
                <article class="sample" id="black-control">
                    <h3>Black control</h3>
                    <div class="icons">
                        <a href="#" class="editableHTML">
                            <div class="sprite-icon icon-faq" aria-hidden="true"></div><span class="lnk-nav-txt">FAQ</span>
                        </a>
                        <ul role="tablist" aria-label="Assessment sample">
                            <li class="tab side-tab" role="tab" tabindex="0" aria-selected="true">
                                <div class="sprite-icon icon-assessment2" aria-hidden="true"></div>
                                <div class="db-icon-txt">Assessment</div>
                            </li>
                        </ul>
                    </div>
                </article>
                <article class="sample original" id="original">
                    <h3>Original CSS chain</h3>
                    <div class="icons">
                        <a href="#" class="editableHTML">
                            <div class="sprite-icon icon-faq" aria-hidden="true"></div><span class="lnk-nav-txt">FAQ</span>
                        </a>
                        <ul role="tablist" aria-label="Assessment sample">
                            <li class="tab side-tab" role="tab" tabindex="0" aria-selected="true">
                                <div class="sprite-icon icon-assessment2" aria-hidden="true"></div>
                                <div class="db-icon-txt">Assessment</div>
                            </li>
                        </ul>
                    </div>
                </article>
                <article class="sample flood" id="inline-flood">
                    <h3>Universal SVG tint / CSS branding</h3>
                    <div class="icons">
                        <a href="#" class="editableHTML">
                            <div class="sprite-icon icon-faq" aria-hidden="true"></div><span class="lnk-nav-txt">FAQ</span>
                        </a>
                        <ul role="tablist" aria-label="Assessment sample">
                            <li class="tab side-tab" role="tab" tabindex="0" aria-selected="true">
                                <div class="sprite-icon icon-assessment2" aria-hidden="true"></div>
                                <div class="db-icon-txt">Assessment</div>
                            </li>
                        </ul>
                    </div>
                    <div class="brand-controls">
                        <label>Default <input id="brand-default" type="color" value="#000000"></label>
                        <label>Hover <input id="brand-hover" type="color" value="#282a73"></label>
                    </div>
                    <div class="reference"><span class="swatch" aria-hidden="true"></span><span id="brand-reference">#000000</span></div>
                </article>
            </div>
            <div class="reference" style="--target: #282a73"><span class="swatch"
                    aria-hidden="true"></span><span>#282A73 reference</span></div>
        </section>
    </main>
    <footer>
        <p class="status">50 x 50 px / solid.svg / sRGB / alpha preserved</p>
        <p class="status" id="sprite-status" role="status">Sprite: loading</p>
        <p class="status" id="browser"></p>
    </footer>
    <script>
        document.querySelector('#force-hover').addEventListener('change', event => {
            document.body.classList.toggle('force-hover', event.target.checked);
            updateBrandReference();
        });
        function updateBrandReference() {
            const state = document.body.classList.contains('force-hover') ? 'hover' : 'default';
            document.querySelector('#brand-reference').textContent = document.querySelector(`#brand-${state}`).value.toUpperCase();
        }
        ['default', 'hover'].forEach(state => {
            document.querySelector(`#brand-${state}`).addEventListener('input', event => {
                document.documentElement.style.setProperty(`--icon-${state}-hex`, event.target.value);
                updateBrandReference();
            });
        });
        document.querySelectorAll('a[href="#"]').forEach(link => {
            link.addEventListener('click', event => event.preventDefault());
        });
        document.querySelector('#browser').textContent = navigator.userAgent;
        const sprite = new Image();
        sprite.onload = () => { document.querySelector('#sprite-status').textContent = 'Sprite: loaded'; };
        sprite.onerror = () => { document.querySelector('#sprite-status').textContent = 'Sprite: FAILED to load solid.svg'; };
        sprite.src = 'solid.svg';
    </script>
</body>

</html>
